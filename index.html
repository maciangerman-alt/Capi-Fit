<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Capifit">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Capifit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6F0; --card:#FFFFFF; --card2:#F4ECE2; --ink:#2B2118; --muted:#8A7A6B; --line:#EADFD2; --track:#EFE5D8;
  --brand:#C9773C; --brand-ink:#FFFFFF; --brand-soft:#F6E3D2; --brand-2:#7A4E2D;
  --good:#3F8F5A; --good-soft:#DCEFE2; --bad:#C94A34; --bad-soft:#F8DDD6; --warn:#C98A1A;
  --prot:#C9573C; --carb:#D9A036; --fat:#5E86B8; --water:#3C8DC9;
  --radius:18px; --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1C1714; --card:#27201B; --card2:#322A23; --ink:#F3EAE0; --muted:#A8998A; --line:#3A3129; --track:#3A3129;
    --brand:#E08B4E; --brand-soft:#4A3222; --brand-2:#F0B98E; --good:#5CB87A; --good-soft:#233A2B; --bad:#E86A52; --bad-soft:#4A2620;
    --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
body{padding-top:var(--safe-t)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card2);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
label{font-size:.82rem;color:var(--muted);font-weight:700;display:block;margin:0 0 4px 2px}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.15rem} h3{font-size:1rem}
small,.muted{color:var(--muted)}
#main{max-width:560px;margin:0 auto;padding:10px 14px calc(150px + var(--safe-b))}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb{margin-bottom:12px}
.center{text-align:center}
.big{font-size:2.1rem;font-weight:900;line-height:1}
.num{font-variant-numeric:tabular-nums}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;background:var(--card2);font-weight:800;min-height:46px}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 12px;border-radius:11px;font-size:.9rem}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:999px;background:var(--card2);font-weight:800;font-size:.88rem;white-space:nowrap}
.chip.on{background:var(--brand);color:var(--brand-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;font-size:.75rem;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand-2)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.list .item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.item .t{font-weight:800;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:.82rem;color:var(--muted)}
.item .k{font-weight:900;white-space:nowrap}
.tap{cursor:pointer}
.bar{height:9px;border-radius:9px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 12px}
.hdr h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hdr.hoy h1{font-size:1.3rem}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{width:36px;height:36px;border-radius:12px;background:var(--card);font-weight:900;font-size:1.1rem;box-shadow:var(--shadow)}
.datenav{flex:none}
.datenav .d{font-weight:900;padding:0 6px;min-width:78px;text-align:center}
.ringwrap{position:relative;width:150px;height:150px;flex:none}
.ringwrap .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.eq{font-size:.83rem;color:var(--muted);display:grid;grid-template-columns:auto auto;gap:3px 10px;align-content:center}
.eq b{color:var(--ink);text-align:right}
.meal h3{display:flex;align-items:center;gap:6px}
.addbtn{color:var(--brand);font-weight:900;padding:6px 2px}
.nudge{background:var(--brand-soft);color:var(--brand-2);border-radius:14px;padding:10px 12px;font-weight:700;font-size:.9rem;margin-bottom:10px}
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:26px;height:32px;border-radius:4px 4px 8px 8px;border:2px solid var(--water);opacity:.35}
.glass.on{background:var(--water);opacity:1}
nav#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--safe-b));z-index:20}
nav#tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;font-weight:800;color:var(--muted);padding:4px 8px;border-radius:12px;min-width:58px}
nav#tabs button .ic{font-size:1.35rem;line-height:1.2;filter:grayscale(1);opacity:.7}
nav#tabs button.on{color:var(--brand)}
nav#tabs button.on .ic{filter:none;opacity:1}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(20,12,6,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + var(--safe-b));max-width:560px;margin:0 auto;-webkit-overflow-scrolling:touch}
.sheet.full{top:calc(var(--safe-t) + 18px);max-height:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sheet-h .x{width:36px;height:36px;border-radius:12px;background:var(--card2);font-weight:900}
.searchbox{position:sticky;top:-8px;background:var(--bg);padding:6px 0 8px;z-index:2}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-size:.75rem;font-weight:800;box-shadow:var(--shadow)}
.tile .ic{font-size:1.4rem;display:block;margin-bottom:2px}
.macro3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro3 .m .v{font-weight:900}
.src{font-size:.8rem;color:var(--muted);background:var(--card2);border-radius:12px;padding:10px 12px}
.src table{width:100%;border-collapse:collapse;margin-top:6px}
.src td{padding:3px 0;border-top:1px dashed var(--line)}
.src td:last-child{text-align:right;font-weight:800;color:var(--ink)}
.src td[colspan]{text-align:left}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts .tile.on{outline:2.5px solid var(--brand)}
.stat{background:var(--card2);border-radius:14px;padding:10px 12px}
.stat .v{font-size:1.3rem;font-weight:900}
.stat .l{font-size:.78rem;color:var(--muted);font-weight:700}
.delta.down{color:var(--good)} .delta.up{color:var(--bad)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block}
.photos .ph{position:relative}
.photos .ph span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;font-weight:800;padding:2px 6px;border-radius:8px}
.photos .ph.sel img{outline:3px solid var(--brand)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp img{width:100%;border-radius:12px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;background:var(--track);border-radius:28px;transition:.2s}
.switch i:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--good)}
.switch input:checked+i:before{transform:translateX(20px)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:800;font-size:.9rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
#tour{position:fixed;inset:0;z-index:90;touch-action:none}
html.touring,html.touring body{overflow:hidden;overscroll-behavior:none}
.tour-bg{position:absolute;inset:0}
.tour-spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(20,12,6,.62);pointer-events:none;transition:all .25s ease;outline:3px solid var(--brand)}
.tour-card{position:fixed;left:14px;right:14px;max-width:520px;margin:0 auto;background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:tourIn .25s ease}
.tour-card p{margin:6px 0 12px;font-size:.95rem}
.tour-skip{color:var(--muted);font-weight:800;font-size:.85rem;padding:4px}
@keyframes tourIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.capi{cursor:pointer;user-select:none;-webkit-user-select:none}
.capi svg{display:block;width:100%;height:auto;overflow:visible}
.capi .c-breath{transform-box:fill-box;transform-origin:50% 100%;animation:cbreath 3.2s ease-in-out infinite}
.capi .c-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:cblink 5.5s infinite}
.capi .c-all{transform-box:fill-box;transform-origin:50% 100%}
.capi.party .c-all{animation:cdance .42s ease-in-out infinite alternate}
.capi.jump .c-all{animation:cjump .55s ease}
@keyframes cbreath{50%{transform:scale(1.03,.97)}}
@keyframes cblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes cdance{from{transform:rotate(-7deg)}to{transform:rotate(7deg) translateY(-6px)}}
@keyframes cjump{35%{transform:translateY(-22px) scale(.96,1.05)}70%{transform:translateY(0) scale(1.05,.95)}}
@media (prefers-reduced-motion:reduce){.capi *{animation:none!important}}

.bubble{position:relative;background:var(--card2);border-radius:16px;padding:10px 12px;font-weight:700;font-size:.92rem;line-height:1.3}
.bubble:before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--card2)}
.bubble-more{font-weight:600;font-size:.8rem;color:var(--muted);margin-top:6px}
#celebrate{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:20px}
#celebrate .cel-bg{position:absolute;inset:0;background:rgba(20,12,6,.55)}
#celebrate .cel-card{position:relative;background:var(--card);border-radius:22px;padding:18px;max-width:360px;width:100%;animation:tourIn .3s ease}
#celebrate .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#celebrate .confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{top:110%;transform:rotate(720deg) translateX(40px)}}
.media-box{position:relative;border-radius:16px;overflow:hidden;margin-bottom:12px;background:var(--card2);aspect-ratio:16/9}
.media-box video,.media-box img{display:block;width:100%;height:100%;object-fit:cover}
.media-box.deco{aspect-ratio:auto;height:170px;box-shadow:var(--shadow)}
.media-box.deco img{object-position:50% 25%}
.media-box.deco span{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:.85rem;padding:5px 10px;border-radius:10px}
#coach-fab{position:fixed;right:14px;bottom:calc(80px + var(--safe-b));z-index:30;display:flex;align-items:center;gap:6px;padding:5px 14px 5px 5px;border-radius:30px;background:var(--brand);color:var(--brand-ink);font-weight:900;font-size:.9rem;box-shadow:0 6px 18px rgba(80,40,10,.3)}
#coach-fab .fab-capi{width:44px;height:44px;border-radius:50%;background:#F6E3D2;overflow:hidden;display:block}
#coach-fab .fab-capi svg{width:62px;height:auto;margin:1px 0 0 -9px;display:block}
#sheet.open ~ #coach-fab,html.touring #celebrate ~ #coach-fab{display:none}
#coach-msgs{min-height:40vh}
.cmsg{display:flex;gap:8px;margin:10px 0;align-items:flex-end}
.cmsg.me{justify-content:flex-end}
.cmsg .cav{width:36px;flex:none}
.cmsg .cav svg{width:36px;height:auto;display:block}
.cb{background:var(--card);padding:10px 12px;border-radius:16px 16px 16px 4px;max-width:82%;box-shadow:var(--shadow);font-size:.95rem;line-height:1.42;overflow-wrap:anywhere}
.cmsg.me .cb{background:var(--brand);color:var(--brand-ink);border-radius:16px 16px 4px 16px}
.cb.err{background:var(--bad-soft);color:var(--bad)}
.cdet{margin-top:8px;font-size:.72rem;opacity:.75;word-break:break-all;font-family:ui-monospace,Menlo,monospace}
.coach-in{position:sticky;bottom:calc(-20px - var(--safe-b));background:var(--bg);display:flex;gap:8px;align-items:flex-end;padding:10px 0 calc(12px + var(--safe-b))}
.coach-in textarea{resize:none;min-height:46px;max-height:120px;line-height:1.35}
.coach-in .btn{min-width:52px;font-size:1.1rem}
.typing i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
#toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:.9rem;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:220px}
#reader video{border-radius:14px}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;max-width:440px;margin:0 auto}
.logo{font-size:3.2rem;text-align:center}
.demo-banner{background:var(--warn);color:#fff;font-weight:800;font-size:.8rem;text-align:center;padding:6px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:.92rem}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit;font-weight:700;font-size:11px;fill:var(--muted)}
.cheer{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.cheer:first-child{border-top:0}
.cheer .e{font-size:1.4rem}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>

const $ = (s, el = document) => el.querySelector(s);

const r0 = n => Math.round(+n || 0);
const r1 = n => Math.round((+n || 0) * 10) / 10;

function ymd(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }

function weekStart(s) { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); }

  return v;
}

// Mismo control que hace Firestore, para que el modo demo falle igual si algo está mal armado
function fsCheck(v, path = '') {

}

const emptyDay = d => ({ date: d, foods: [], acts: [], water: 0, steps: null, sleep: null });
const byTs = (a, b) => (a.ts || 0) - (b.ts || 0);

function normDay(raw, d) {
  if (!raw) return emptyDay(d);
  const list = x => (Array.isArray(x) ? x : Object.values(x || {})).filter(Boolean).sort(byTs);
  return { date: raw.date || d, foods: list(raw.foods), acts: list(raw.acts), water: Math.max(0, raw.water || 0), steps: raw.steps ?? null, sleep: raw.sleep ?? null, goal: raw.goal ?? null };

function toMapDay(raw, d) {

  r.date = d; r.foods = m(r.foods); r.acts = m(r.acts); return r;
}
function applyOpRaw(r, op) {
  if (op.putFoods) op.putFoods.forEach(e => { r.foods[e.id] = clean(e); });
  if (op.delFood) delete r.foods[op.delFood];
  if (op.putAct) r.acts[op.putAct.id] = clean(op.putAct);
  if (op.delAct) delete r.acts[op.delAct];
  if (op.water) r.water = Math.max(0, (r.water || 0) + op.water);
  if (op.set) Object.assign(r, clean(op.set));

function applyOpDay(day, op) {
  if (op.putFoods) op.putFoods.forEach(e => { const i = day.foods.findIndex(x => x.id === e.id); if (i >= 0) day.foods[i] = e; else day.foods.push(e); });
  if (op.delFood) day.foods = day.foods.filter(x => x.id !== op.delFood);
  if (op.putAct) { const i = day.acts.findIndex(x => x.id === op.putAct.id); if (i >= 0) day.acts[i] = op.putAct; else day.acts.push(op.putAct); }
  if (op.delAct) day.acts = day.acts.filter(x => x.id !== op.delAct);
  if (op.water) day.water = Math.max(0, (day.water || 0) + op.water);
  if (op.set) Object.assign(day, op.set);

const KCAL_KG = 7700;      // ~7.700 kcal por kilo de grasa

function curWeight() { const b = lastBody('w'); return b ? b.w : (S.profile?.weight || 70); }
function T() {

  // de 1.000 kcal de déficit por día. Nunca por debajo de 1.500 kcal (hombres) / 1.200 (mujeres).
  const sexFloor = p.sex === 'M' ? 1500 : 1200;
  const floor = Math.max(sexFloor, Math.round(tdee - MAX_DEFICIT));
  let adj = 0, capped = false;
  if (p.goal === 'bajar') { const want = w * pacePct(p) / 100 * KCAL_KG / 7; adj = -Math.min(want, MAX_DEFICIT); capped = want > MAX_DEFICIT; }
  if (p.goal === 'subir') adj = (p.pace === 0.5 ? 0.5 : 0.25) * KCAL_KG / 7;
  let kcal = tdee + adj, floored = false;
  if (kcal < floor) { floored = !capped && kcal < floor - 5; kcal = floor; }
  let manual = false;
  if (p.manualKcal) { kcal = p.manualKcal; manual = true; }
  kcal = Math.round(kcal / 10) * 10;
  const bmi = w / Math.pow(h / 100, 2);
  const refW = bmi > 30 ? 27 * Math.pow(h / 100, 2) : w;
  const pG = Math.round(refW * (p.goal === 'mantener' ? 1.6 : 1.8));
  const fG = Math.round(Math.max(refW * 0.8, kcal * 0.25 / 9));
  const cG = Math.max(0, Math.round((kcal - pG * 4 - fG * 9) / 4));
  const weekly = (kcal - tdee) * 7 / KCAL_KG; // kg por semana esperados (negativo = bajar)
  return { bmr, tdee, adj, kcal, floor, floored, manual, capped, weekly, p: pG, f: fG, c: cG, water: Math.round(Math.min(Math.max(w * 35, 1500), 3000) / 250) * 250, w, h, bmi, formula, act };
}
function entryTot(e) {
  if (e.quick) return { kcal: e.kcal || 0, p: e.p || 0, c: e.c || 0, f: e.f || 0 };
  const m = (e.g || 0) / 100; return { kcal: e.k * m, p: e.p * m, c: e.c * m, f: e.f * m };
}
function actNet(a) { return a.kcal != null ? a.kcal : 0; }
function dayTotals(d) {
  const t = { kcal: 0, p: 0, c: 0, f: 0, burn: 0, min: 0, n: 0 };
  (d?.foods || []).forEach(e => { const x = entryTot(e); t.kcal += x.kcal; t.p += x.p; t.c += x.c; t.f += x.f; t.n++; });
  (d?.acts || []).forEach(a => { t.burn += actNet(a); t.min += a.min || 0; });
  t.counted = t.burn * ((S.profile?.exPct ?? 100) / 100);
  return t;
}
// Cada día guarda la meta que tenía ese día: si cambia tu peso, el historial no se reescribe.
function dayGoal(d) { return (d && d.goal) || T().kcal; }
function inGoal(d) {
  const t = dayTotals(d); if (!t.n) return false; const r = t.kcal / (dayGoal(d) + t.counted); const g = S.profile?.goal;
  if (g === 'bajar') return r >= 0.75 && r <= 1.05;   // comer un poco menos también es cumplir
  if (g === 'subir') return r >= 0.95 && r <= 1.15;
  return r >= 0.9 && r <= 1.1;
}
function isLogged(d) { return (d?.foods || []).length > 0; }
function streakFrom(dates) {
  const set = new Set(dates); let d = today(); if (!set.has(d)) d = addDays(d, -1); let n = 0;
  while (set.has(d)) { n++; d = addDays(d, -1); } return n;
}
function myLoggedDates() { return Object.entries(S.days).filter(([, v]) => isLogged(v)).map(([k]) => k); }
function weekStats() {
  const ws = weekStart(today()); let min = 0, logged = 0, goal = 0, burn = 0;
  for (let i = 0; i < 7; i++) { const d = addDays(ws, i); const v = S.days[d]; if (!v) continue; const t = dayTotals(v); min += t.min; burn += t.burn; if (isLogged(v)) logged++; if (inGoal(v)) goal++; }
  return { min, logged, goal, burn, ws };
}

// Arregla datos viejos: si había dos mediciones el mismo día, quedan en una
async function dedupeBody(list) {
  const byDate = {}; const out = [];
  for (const b of list) { if (byDate[b.date]) { const keep = byDate[b.date]; Object.assign(keep, { ...b, id: keep.id }); Store.deleteBody(b.id).catch?.(() => { }); keep._dirty = true; } else { byDate[b.date] = b; out.push(b); } }
  for (const b of out) if (b._dirty) { delete b._dirty; Store.saveBody(b); }
  return out.sort((a, b) => a.date < b.date ? -1 : 1);
}
async function loadDays() {
  const jan1 = today().slice(0, 4) + '-01-01'; const from = [addDays(today(), -120), addDays(jan1, -7)].sort()[0];
  const list = await Store.getDaysRange(from, today());
  S.days = {}; list.forEach(d => { S.days[d.id] = normDay(d, d.id); });
}
// Abre un día. Si tocás las flechas rápido, solo gana el último pedido (no se mezclan días).
async function openDate(d) {
  if (d > today()) d = today();
  const tok = S._dateTok = (S._dateTok || 0) + 1;
  let day = S.days[d];
  if (!day) { try { day = normDay(await Store.getDay(d), d); } catch (e) { day = emptyDay(d); } }
  if (tok !== S._dateTok) return;
  S.days[d] = day; S.day = day; S.date = d; S.wasToday = d === today();
  watchDay(d); render();
}
// Si la misma cuenta está abierta en otro celular, los cambios aparecen solos.
function watchDay(d) {
  if (S._dayUnsub) { try { S._dayUnsub(); } catch (e) { } S._dayUnsub = null; }
  if (!Store.listenDay) return;
  S._dayUnsub = Store.listenDay(d, raw => {
    if (!raw) return; const day = normDay(raw, d); S.days[d] = day;
    if (S.date === d) { S.day = day; if (!S._tour && (S.tab === 'hoy' || S.tab === 'act')) render(); }
  });
}
// Todo cambio de un día pasa por acá: se aplica al instante en pantalla y se guarda solo lo que cambió.
async function dayOp(op) {
  const day = S.day; const date = day.date; S.days[date] = day;
  applyOpDay(day, op); day.goal = T().kcal;
  if (S.tab === 'hoy' || S.tab === 'act') render();
  try { await Store.applyDayOp(date, op, day.goal); } catch (e) { console.error(e); toast('No se pudo guardar: ' + (e.message || e)); }
  publishShared();
}

  mantequilla: ['manteca', 'mantequilla'], boniato: ['batata'], guisante: ['arveja'], patata: ['papa'], cacahuate: ['mani'], chancho: ['cerdo'],
  frijol: ['poroto'], frijoles: ['poroto'], soda: ['soda', 'con gas'], burger: ['hamburguesa'], hamburguer: ['hamburguesa'], chori: ['chori'],
  lomo: ['lomo', 'lomito'], jugo: ['jugo'], cafecito: ['cafe'], pancho: ['pancho', 'salchicha'], tuco: ['tuco', 'salsa'], torta: ['torta', 'bizcochuelo'],
  bebida: ['gaseosa', 'jugo', 'agua'], vino: ['vino'], trago: ['gin', 'fernet', 'vermut', 'whisky'], chocolatada: ['chocolatada', 'chocolate'], helado: ['helado', 'palito']

function stem(t) { if (t.length > 4 && /[^aeiou]es$/.test(t)) return t.slice(0, -2); if (t.length > 3 && /[aeiou]s$/.test(t)) return t.slice(0, -1); return t; }

function lev(a, b, max) {

function searchFoods(q, forRecipe) {
  const toks = norm(q).split(/\s+/).filter(Boolean); if (!toks.length) return [];
  const alts = toks.map(tokenAlts); const phrase = toks.map(stem).join(' ');
  const recentIds = new Set((S.profile.recent || []).map(r => r.id));

    const s = f._s || (f._s = norm(f.n + ' ' + (f.a || '')));

    const nn = norm(f.n).replace(/\s*\(.*?\)\s*/g, ' ').trim(); let sc = 0;

// ---------- Open Food Facts ----------
function offToFood(p) {
  const n = p.nutriments || {}; let k = n['energy-kcal_100g']; if (k == null && n['energy_100g'] != null) k = n['energy_100g'] / 4.184;
  const brand = (p.brands || '').split(',')[0].trim();
  const name = [p.product_name_es || p.product_name || p.generic_name || 'Producto sin nombre', brand].filter(Boolean).join(' · ');
  const por = []; const sq = parseFloat(p.serving_quantity); if (sq > 0) por.push([`1 porción (${r0(sq)} g)`, r0(sq)]);
  const food = { id: 'off-' + p.code, code: p.code, n: name, k: k != null ? r1(k) : null, p: r1(n.proteins_100g), c: r1(n.carbohydrates_100g), f: r1(n.fat_100g), por, src: 'Open Food Facts (etiqueta del producto)', off: true };
  food._s = norm(food.n); if (k == null) food.missing = true; return food;
}
async function offProduct(code) {
  const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}?fields=code,product_name,product_name_es,generic_name,brands,nutriments,serving_quantity`);
  if (!r.ok && r.status !== 404) throw new Error('OFF ' + r.status);
  const j = await r.json(); if (j.status !== 1 || !j.product) return null; return offToFood(j.product);
}
async function offSearch(q) {
  const url = h => `https://${h}.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&fields=code,product_name,product_name_es,brands,nutriments,serving_quantity`;
  let prods = [];
  try {
    let j = await (await fetch(url('ar'))).json(); prods = j.products || [];
    if (!prods.length) { j = await (await fetch(url('world'))).json(); prods = j.products || []; }
  } catch (e) {
    // Buscador nuevo de Open Food Facts (search-a-licious)
    const j = await (await fetch(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&langs=es&page_size=24`)).json();
    prods = (j.hits || []).map(h => ({ ...h, brands: Array.isArray(h.brands) ? h.brands.join(',') : h.brands, product_name: h.product_name_es || h.product_name || (h.product_name && h.product_name.es) }));
  }
  return prods.map(offToFood).filter(f => !f.missing);
}

function movingAvg(points, days = 7) {
  return points.map(p => { const from = addDays(p.date, -(days - 1)); const win = points.filter(q => q.date >= from && q.date <= p.date); return r1(win.reduce((s, q) => s + q.v, 0) / win.length); });
}
function bodyDelta(key, sinceDays) {
  const pts = S.body.filter(b => b[key] != null); if (pts.length < 2) return null;
  const last = pts[pts.length - 1]; let base = pts[0];
  if (sinceDays) { const lim = addDays(last.date, -sinceDays); const cand = pts.filter(p => p.date <= lim); base = cand.length ? cand[cand.length - 1] : pts[0]; }
  if (base === last) return null;
  const days = Math.round((parseYmd(last.date) - parseYmd(base.date)) / 864e5);
  return { d: last[key] - base[key], days };
}
function deltaTxt(key, since) { const r = bodyDelta(key, since); if (!r) return '<span class="muted">—</span>'; return `${deltaHtml(key, r.d)} en ${r.days} ${r.days === 1 ? 'día' : 'días'}`; }
function deltaHtml(key, d) {
  if (d == null || Math.abs(d) < 0.05) return '<span class="muted">=</span>';
  const m = BM_BY[key]; const good = m.lowGood == null ? null : (m.lowGood ? d < 0 : d > 0);
  return `<span class="delta ${good == null ? '' : good ? 'down' : 'up'}">${d > 0 ? '+' : ''}${fmt1(d)} ${m.u}</span>`;
}

function drawBodyChart() {
  const box = $('#bchart'); if (!box) return;
  const key = S.chartMetric; const m = BM_BY[key];
  const pts = S.body.filter(b => b[key] != null).map(b => ({ date: b.date, v: b[key] }));
  if (!pts.length) { box.innerHTML = ''; return; }
  const W = 340, H = 190, L = 34, R = 10, Tp = 12, B = 24;
  const t0 = parseYmd(pts[0].date).getTime(), t1 = parseYmd(pts[pts.length - 1].date).getTime(), span = Math.max(t1 - t0, 864e5);
  const avg = key === 'w' && pts.length > 2 ? movingAvg(pts) : null;
  const vals = pts.map(p => p.v).concat(avg || []);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = Math.max((hi - lo) * 0.15, key === 'w' ? 0.5 : 0.3); lo -= pad; hi += pad;
  const X = d => pts.length === 1 ? (L + W - R) / 2 : L + (parseYmd(d).getTime() - t0) / span * (W - L - R);
  const Y = v => Tp + (hi - v) / (hi - lo) * (H - Tp - B);

// Qué tan gordito está el capi según el progreso hacia la meta (1 = al empezar, 0,18 = llegó)
function capiFatFor(w) {
  const p = S.profile || {}; if (p.goal !== 'bajar') return 0.55;
  const start = (S.body.find(b => b.w != null) || {}).w || w; if (!w || !start) return 1;
  let prog = p.goalW && start > p.goalW ? (start - w) / (start - p.goalW) : (start - w) / start / 0.10;
  prog = Math.max(0, Math.min(1, prog)); return 1 - prog * 0.82;
}

function capiState() {

  const isToday = S.date === today(); const streak = streakFrom(myLoggedDates());
  const o = { band: (S.day.acts || []).length > 0, tang: streak >= 3 };

  if (!tot.n && isToday && h >= 10) { mood = 'hungry'; say.push(h < 15 ? 'Tengo hambre… ¿qué comimos hoy? Cargalo así no se nos olvida 🍽️' : '¡No cargamos nada hoy! Contame qué comiste 🍽️'); }
  else if (left < 0) { mood = 'full'; say.push(`Uf, hoy nos pasamos ${fmtK(-left)} kcal. No pasa nada: mañana arrancamos de nuevo 💪`); }
  else if (tot.n && budget && tot.kcal / budget > 0.9) say.push(`Ya casi llegamos: quedan ${fmtK(left)} kcal. Algo liviano si picamos 👀`);
  if (o.band) say.push(`¡Qué entrenamiento! Me gané la vincha. +${fmtK(tot.burn)} kcal para comer hoy 🏃`);
  if (isToday && h >= 15 && tot.n && !S.day.foods.some(e => e.meal === 'almuerzo')) say.push('¿Cargaste el almuerzo? 🍽️');
  if (isToday && h >= 22 && tot.n && !S.day.foods.some(e => e.meal === 'cena')) say.push('Falta la cena 🌙');
  const lw = lastBody('w'); if (isToday && (!lw || (Date.now() - parseYmd(lw.date).getTime()) > 7 * 864e5)) say.push('Toca pesarse: una vez por semana, en ayunas y después del baño ⚖️');
  if (isToday && h >= 16 && (S.day.water || 0) < t.water * 0.4) say.push('Tomá agüita, que los carpinchos vivimos en el agua 💧');
  if (o.tang && !say.length) say.push(`¡${streak} días seguidos cargando! Me gané una mandarina 🍊`);

async function coachModel(system, model) {

      import(`https://www.gstatic.com/firebasejs/${AI_SDK}/firebase-app.js`),

}

function coachSystem() {
  return `Sos "Capi", el coach de Capifit: un carpincho simpático que acompaña a ${S.profile.name} con su alimentación, calorías, ejercicio y progreso. Hablás en español rioplatense (de "vos"), cálido, directo y con un poco de humor. Máximo 1 o 2 emojis por respuesta.

CÓMO RESPONDER
- Andá DIRECTO a lo que pregunta desde la primera línea. No arranques saludando ni repitiéndole sus propios datos: usalos para decidir qué recomendar, y mencioná solo el número que importa (ej. "con las 1.019 kcal que te quedan…"). Saludá solo si te saluda.
- Sé concreto y útil, como un nutricionista y entrenador que lo conoce: nada de consejos genéricos tipo "comé sano" o "tomá agua".
- Si pide ideas u opciones (comidas, meriendas, cenas): dale 3 a 5 opciones concretas, cada una con cantidad casera, kcal y proteína aproximadas, que entren en lo que le queda del día y ayuden con lo que le falta (por ejemplo proteína).
- Si pide una rutina: ejercicios con series, repeticiones o minutos, adaptados a su peso y nivel.
- Si pregunta por su progreso: interpretá la tendencia con sus números (promedios, qué días se pasó, qué está funcionando) y cerrá con 1 o 2 acciones concretas.
- Largo: lo justo para que sirva, sin relleno (en general entre 60 y 200 palabras). Usá listas con "-" y **negrita** para lo importante.
- No inventes datos que no están; si falta algo, decilo y sugerí cargarlo en la app.
- Las calorías de las comidas son estimaciones: si das números, decí que son aproximados.
- Para ideas de comidas, preferí platos argentinos comunes y porciones caseras.
- Si preguntan cómo usar la app: Capifit tiene las secciones Hoy (anillo de calorías, comidas, agua, copiar el día anterior), Actividad (cargar deportes y minutos, pasos, sueño), Progreso (mediciones con balanza y cinta, gráfico, fotos privadas, objetivos por semana/mes/trimestre/año, transformación del capi), Pareja (código para vincularse, desafío semanal, aplausos, privacidad) y Perfil (meta, datos, Excel). Para cargar comida: "+ Agregar" en cada comida; hay buscador, escáner de código de barras, carga rápida, crear alimento y crear receta.
- Temas fuera de alimentación, ejercicio, hábitos o la app: respondé muy breve y volvé al tema.
- No tenés datos de la pareja: no hables de ella/él.

SEGURIDAD (obligatorio)
- Nunca recomiendes comer menos que la meta de la app, déficits de más de 1.000 kcal por día ni bajar más de ~1 % del peso por semana. Si piden ir más rápido, explicá con sus números por qué no conviene y sugerí hablarlo con un médico.
- No recomiendes ayunos extremos, laxantes, diuréticos, vomitar, pastillas para adelgazar ni suplementos milagrosos.
- No diagnostiques ni indiques medicamentos. Ante síntomas (dolor de pecho, mareos, desmayos, falta de aire, dolor fuerte) decí que consulte a un médico o vaya a una guardia. Con mucho peso para bajar o problemas de salud, recomendá un chequeo médico.
- Si aparecen señales de una relación difícil con la comida (culpa fuerte, compensar comiendo nada o vomitando, miedo a comer, atracones con angustia), respondé con cuidado, sin números de calorías, y sugerí hablar con un profesional de salud.
- Nunca retes ni avergüences: un mal día es un mal día; proponé el próximo paso.

EJEMPLO DE BUENA RESPUESTA (a "ideas de merienda con proteína", con 1.019 kcal y 78 g de proteína por cubrir):
Con lo que te queda tenés margen de sobra, así que apuntemos a la proteína 💪
- **Yogur griego (160 g) + 1 cucharada de granola**: ~210 kcal, 17 g de proteína
- **Tostado de pan integral con jamón y queso**: ~300 kcal, 20 g
- **2 huevos revueltos + 1 tostada**: ~250 kcal, 15 g
- **Licuado de leche descremada, banana y 1 scoop de whey**: ~300 kcal, 30 g
Con el licuado o el griego llegás a la cena habiendo cubierto casi la mitad de lo que te falta.

DATOS DE ${S.profile.name.toUpperCase()} (actualizados ahora):
${coachContext()}`;
}

// Código HTTP y texto del error que devuelve Firebase AI (sin confundirse con la URL, que contiene "generateContent")
function coachErrInfo(e) {
  const status = e?.customErrorData?.status || (String(e?.message || '').match(/\[(\d{3})\b/) || [])[1];
  const code = String(e?.code || '');
  const msg = String(e?.message || e || '').replace(/Error fetching from \S+:\s*/, '').replace(/^AI:\s*/, '');
  return { status: status ? +status : null, code, msg };
}
function coachErr(e) {
  const { status, code, msg } = coachErrInfo(e);
  if (code.includes('api-not-enabled') || /SERVICE_DISABLED|has not been used|is disabled|not been enabled/i.test(msg)) return 'Falta activar la IA en Firebase: en la consola, AI Logic → Comenzar → Gemini Developer API. Después volvé a preguntar.';
  if (status === 429 || /RESOURCE_EXHAUSTED|quota/i.test(msg)) return 'Uf, el capi se cansó de tanto hablar: llegamos al límite gratis de la IA por ahora. Probá de nuevo en un rato 😴';
  if (!status && (/Failed to fetch|NetworkError|Load failed|network|importing a module|dynamically imported/i.test(msg) || !navigator.onLine)) return 'No tengo conexión para pensar 📡 Probá cuando tengas señal.';
  if (/SAFETY|blocked/i.test(msg) && !status) return 'Esa no te la puedo contestar. Probá preguntarlo de otra forma.';
  if (status === 403) return 'Firebase no dejó usar la IA (permiso denegado). Revisá que AI Logic esté activado con Gemini Developer API.';
  return 'Algo falló al responder. Probá de nuevo en un ratito.';
}
async function coachSend(q) {
  const c = S.coach; if (c.busy) return;
  const input = $('#coach-q'); const text = (q || input?.value || '').trim(); if (!text) return;
  if (coachCount() >= COACH_LIMIT) return toast('Llegaste al máximo de preguntas por hoy. Mañana seguimos 🦫', 3500);
  // Solo pares pregunta → respuesta que salieron bien (Gemini exige que se alternen)
  const pairs = [];
  for (let i = 0; i < c.msgs.length - 1; i++) { const u = c.msgs[i], m = c.msgs[i + 1]; if (u.r === 'user' && m.r === 'model' && !m.err && m.t) { pairs.push(u, m); i++; } }
  const history = pairs.slice(-16);
  c.msgs.push({ r: 'user', t: text }); c.msgs.push({ r: 'model', t: '' }); c.busy = true; renderCoach(); coachCount(true);
  const live = c.msgs[c.msgs.length - 1]; const system = coachSystem(); let lastErr = null;
  const tried = []; const models = coachModels(); let retried = false;
  for (let mi = 0; mi < models.length; mi++) {
    const model = models[mi];
    try {
      const chat = (await coachModel(system, model)).startChat({ history: history.map(m => ({ role: m.r, parts: [{ text: m.t }] })) });
      const res = await chat.sendMessageStream(text);
      for await (const ch of res.stream) {
        let part = ''; try { part = ch.text(); } catch (e) { }
        live.t += part; const b = $('#coach-live'); if (b) { b.innerHTML = coachMd(live.t); const box = $('.sheet'); if (box) box.scrollTop = box.scrollHeight; }
      }
      let fin = null; try { const full = await res.response; fin = full?.candidates?.[0]?.finishReason; if (!live.t.trim()) live.t = full.text(); } catch (e) { }
      if (fin === 'MAX_TOKENS' && live.t.trim()) live.t += '\n\n_(Se me cortó: decime "seguí" y termino.)_';
      if (!live.t.trim()) throw new Error('Respuesta vacía');
      try { localStorage.setItem('capifit_ai_model', model); } catch (e) { }
      lastErr = null; break;
    } catch (e) {
      console.warn('coach', model, e); lastErr = e; live.t = '';
      const { status, code, msg } = coachErrInfo(e); tried.push(`${model}: ${status || code || ''} ${msg}`.slice(0, 160));
      // Sin conexión o IA sin activar: no tiene sentido probar otro modelo
      if (code.includes('api-not-enabled') || /SERVICE_DISABLED|has not been used/i.test(msg)) break;
      // Corte de conexión (Safari: "Load failed"): reintenta una vez el mismo modelo antes de rendirse
      if (!status && /Failed to fetch|NetworkError|Load failed|network connection was lost|importing a module|dynamically imported/i.test(msg)) {
        if (!retried && navigator.onLine) { retried = true; mi--; const b = $('#coach-live'); if (b) b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; await new Promise(r => setTimeout(r, 1200)); continue; }
        break;
      }
      try { if (localStorage.getItem('capifit_ai_model') === model) localStorage.removeItem('capifit_ai_model'); } catch (x) { }
    }
  }
  if (lastErr) live.detail = tried.slice(-3).join(' · ');
  if (lastErr) { live.t = coachErr(lastErr); live.err = true; }
  c.busy = false; coachSave(); if ($('#coach-msgs')) renderCoach();
}

const PERIODS = { week: ['Semana', 'semanal', 1], month: ['Mes', 'mensual', 4.35], quarter: ['Trimestre', 'trimestral', 13], year: ['Año', 'anual', 52] };
const GOAL_TYPES = {
  kg: { t: 'Bajar kilos', u: 'kg', icon: '⚖️', dec: 1 },
  min: { t: 'Minutos de actividad', u: 'min', icon: '🏃', dec: 0 },
  sessions: { t: 'Entrenamientos', u: 'entrenamientos', icon: '💪', dec: 0 },
  logged: { t: 'Días cargando comida', u: 'días', icon: '📝', dec: 0 },
  ingoal: { t: 'Días dentro de la meta', u: 'días', icon: '🎯', dec: 0 }
};
function periodRange(per, d = today()) {
  const [y, m] = d.split('-').map(Number); const z = n => String(n).padStart(2, '0');
  const lastDay = (yy, mm) => new Date(yy, mm, 0).getDate();
  if (per === 'week') { const a = weekStart(d); return [a, addDays(a, 6)]; }
  if (per === 'month') return [`${y}-${z(m)}-01`, `${y}-${z(m)}-${z(lastDay(y, m))}`];
  if (per === 'quarter') { const q0 = Math.floor((m - 1) / 3) * 3 + 1; return [`${y}-${z(q0)}-01`, `${y}-${z(q0 + 2)}-${z(lastDay(y, q0 + 2))}`]; }
  return [`${y}-01-01`, `${y}-12-31`];
}
function periodLabel(per, a) {
  const d = parseYmd(a); const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  if (per === 'week') return 'Semana del ' + fmtDate(a, false);
  if (per === 'month') return MES[d.getMonth()][0].toUpperCase() + MES[d.getMonth()].slice(1) + ' ' + d.getFullYear();
  if (per === 'quarter') return `${Math.floor(d.getMonth() / 3) + 1}º trimestre ${d.getFullYear()}`;
  return 'Año ' + d.getFullYear();
}
function prevPeriodStart(per, a) { return per === 'week' ? addDays(a, -7) : periodRange(per, addDays(a, -1))[0]; }
// Peso de referencia al arrancar el período: la última pesada antes (o la primera dentro)
function weightAt(date, before) { const pts = S.body.filter(b => b.w != null); const prev = pts.filter(b => before ? b.date < date : b.date <= date); return prev.length ? prev[prev.length - 1] : null; }
function goalProgress(g, a, b) {
  const end = b < today() ? b : today();
  if (g.type === 'kg') {

      ${t.capped ? `<tr><td colspan="2">Tu ritmo pedía más, pero el déficit tiene un tope de ${fmtK(MAX_DEFICIT)} kcal por día. Bajar más rápido que esto hace perder músculo y es difícil de sostener: si querés ir más rápido, hacelo con un médico.</td></tr>` : ''}
      ${t.floored ? `<tr><td colspan="2">⚠️ La meta quedó en el piso de seguridad (${fmtK(t.floor)} kcal).</td></tr>` : ''}
      ${t.manual ? `<tr><td colspan="2">Estás usando una meta manual.${t.kcal < t.floor ? ' ⚠️ Está por debajo del piso recomendado (' + fmtK(t.floor) + ' kcal).' : ''}</td></tr>` : ''}
    </table></div>
    ${goalCard()}</div>
  <div class="card" data-t="mas-datos"><h3>👤 Tus datos</h3><div class="mt">${profileForm(p)}</div>
    <div class="grid2 mt"><div><label>Fórmula</label><select id="pf-formula"><option value="mifflin">Mifflin-St Jeor (recomendada)</option><option value="katch" ${p.formula === 'katch' ? 'selected' : ''}>Katch-McArdle (usa % grasa)</option></select></div>
    <div><label>kcal de ejercicio que suman</label><select id="pf-ex">${[[100, 'Todas (100 %)'], [75, '75 %'], [50, 'La mitad (50 %)'], [0, 'Ninguna']].map(([v, tx]) => `<option value="${v}" ${(p.exPct ?? 100) == v ? 'selected' : ''}>${tx}</option>`).join('')}</select></div></div>
    <div class="mt"><label>Meta manual de kcal (dejalo vacío para usar la calculada)</label><input id="pf-man" inputmode="numeric" value="${p.manualKcal || ''}"></div>
    <button class="btn primary block mt" onclick="saveProfileForm()">Guardar</button></div>
  ${DEMO ? '' : `<div class="card" data-t="mas-priv"><h3>🔒 Qué ve tu pareja de vos</h3>${privacyToggles()}</div>`}
  <div class="card" data-t="mas-export"><h3>📤 Exportar</h3><p class="muted" style="margin-top:4px">Excel con comidas, actividad y mediciones de los últimos 90 días.</p><button class="btn block" onclick="exportXls()">Descargar Excel</button></div>
  <div class="card"><h3>📚 La base de calorías</h3><p class="muted" style="margin-top:4px;font-size:.9rem">${FOODS.length} alimentos, ${FOODS.filter(f => f.r).length} de ellos platos caseros calculados ingrediente por ingrediente (con el aceite que absorbe lo frito y el agua que pierde la carne). Referencias: USDA FoodData Central, tablas argentinas ARGENFOODS/SARA y etiquetas. Los envasados salen de Open Food Facts por código de barras. En cada alimento, tocá "¿De dónde sale este número?".</p></div>

}
function goalCard() {
  const p = S.profile; if (p.goal !== 'bajar' || !p.goalW) return '';
  const pr = projection(p.goalW); if (!pr) return '';
  if (pr.stuck) return `<div class="nudge mt">Con esta meta no llegás a ${fmt1(p.goalW)} kg. Revisá la meta manual o el ritmo.</div>`;
  const start = (S.body.find(b => b.w != null) || {}).w || curWeight(); const done = Math.max(0, Math.min(1, (start - curWeight()) / (start - p.goalW)));
  return `<div class="src mt" data-t="goal-card"><b>🎯 Camino a ${fmt1(p.goalW)} kg</b>
    <div class="bar mt" style="margin:8px 0 4px"><i style="width:${done * 100}%;background:var(--good)"></i></div>
    <small>Empezaste en ${fmt1(start)} kg · hoy ${fmt1(curWeight())} kg · faltan ${fmt1(curWeight() - p.goalW)} kg</small>
    <table><tr><td>En 4 semanas</td><td>≈ ${fmt1(pr.first4)} kg</td></tr><tr><td>En 12 semanas</td><td>≈ ${fmt1(pr.first12)} kg</td></tr>
    <tr><td>Llegás aprox.</td><td>${fmtDate(pr.date)} ${parseYmd(pr.date).getFullYear()} (${pr.weeks} semanas)</td></tr></table>
    <div class="mt">Las primeras 1-2 semanas la balanza baja más rápido (1-3 kg de agua y comida que ya no está en el cuerpo). Después se estabiliza: es normal, no es que te estancaste.</div></div>`;
}
async function saveProfileForm() {
  try {
    const { o, w } = readProfileForm();
    o.formula = $('#pf-formula').value; o.exPct = parseInt($('#pf-ex').value); o.manualKcal = num($('#pf-man').value) || null;
    if (o.formula === 'katch' && !lastBody('fat')) { toast('Katch-McArdle necesita un % de grasa cargado. Uso Mifflin.'); o.formula = 'mifflin'; }
    await Store.saveProfile(o); S.profile = { ...S.profile, ...o };
    const lw = lastBody('w'); if (!lw || Math.abs(lw.w - w) > 0.05) { const e = { id: rid(), date: today(), w }; const same = S.body.find(b => b.date === today()); if (same) { same.w = w; await Store.saveBody(same); } else { S.body.push(e); await Store.saveBody(e); } }
    publishShared(); render(); toast('Guardado ✅');
  } catch (e) { toast(e.message || e); }
}

// ---------- Excel (SpreadsheetML) ----------
// Excel real (.xlsx). En iPhone abre el menú de compartir (Guardar en Archivos, WhatsApp, mail…).
async function exportXls() {
  toast('Armando el Excel…');
  try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); } catch (e) { return toast('Necesito internet para armar el Excel'); }
  const from = addDays(today(), -90); const days = (await Store.getDaysRange(from, today())).map(d => normDay(d, d.id));
  const res = [], com = [], act = [];
  for (const d of days) {
    const tt = dayTotals(d);
    res.push([d.date, r0(tt.kcal), r0(dayGoal(d) + tt.counted), r0(tt.p), r0(tt.c), r0(tt.f), r0(tt.burn), r0(tt.min), d.water || 0, d.steps ?? null, d.sleep ?? null]);
    (d.foods || []).forEach(e => { const et = entryTot(e); com.push([d.date, mealName(e.meal), e.n, entryLabel(e), e.quick ? null : r0(e.g), r0(et.kcal), r1(et.p), r1(et.c), r1(et.f)]); });
    (d.acts || []).forEach(a => act.push([d.date, a.name, a.min, a.kcal]));
  }
  const body = S.body.map(b => [b.date, ...BM.map(m => b[m.k] ?? null)]);
  const wb = XLSX.utils.book_new();
  const add = (name, head, rows, widths) => { const ws = XLSX.utils.aoa_to_sheet([head, ...rows]); ws['!cols'] = widths.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name); };
  add('Resumen diario', ['Fecha', 'kcal comidas', 'Meta (con ejercicio)', 'Proteína g', 'Carbos g', 'Grasas g', 'kcal ejercicio', 'Min actividad', 'Agua ml', 'Pasos', 'Sueño h'], res, [12, 12, 18, 11, 10, 10, 13, 13, 9, 8, 8]);
  add('Comidas', ['Fecha', 'Comida', 'Alimento', 'Porción', 'Gramos', 'kcal', 'Proteína', 'Carbos', 'Grasas'], com, [12, 11, 38, 26, 8, 7, 9, 8, 8]);
  add('Actividad', ['Fecha', 'Actividad', 'Minutos', 'kcal'], act, [12, 28, 9, 7]);
  add('Cuerpo', ['Fecha', ...BM.map(m => `${m.t} (${m.u})`)], body, [12, ...BM.map(() => 14)]);
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const name = `capifit-${norm(S.profile.name || 'datos').replace(/[^a-z0-9]+/g, '-')}-${today()}.xlsx`;
  const file = new File([out], name, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /iphone|ipad|android/i.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: 'Capifit' }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('Excel descargado 📤');
}

function toursSeen() {
  let l = {}; try { l = JSON.parse(localStorage.getItem('capifit_tours')) || {}; } catch (e) { }
  const all = { ...l, ...(S.profile?.tours || {}) }; const since = S.profile?.toursReset || 0; const out = {};
  for (const k in all) if (all[k] > since) out[k] = 1; return out;
}
function markTour(k) {
  const now = Date.now(); let l = {}; try { l = JSON.parse(localStorage.getItem('capifit_tours')) || {}; } catch (e) { }
  l[k] = now; try { localStorage.setItem('capifit_tours', JSON.stringify(l)); } catch (e) { }
  S.profile.tours = { ...(S.profile.tours || {}), [k]: now }; Promise.resolve(Store.saveProfile({ tours: { [k]: now } })).catch(() => { });
}
function visibleEl(sel) { const el = document.querySelector(sel); return el && el.getClientRects().length ? el : null; }
function maybeTour(k) {
  if (S._tour || !S.profile || toursSeen()[k]) return;
  clearTimeout(S._tourT); S._tourT = setTimeout(() => startTour(k), 450);
}
function startTour(k) {
  if (S._tour || toursSeen()[k]) return;
  const steps = (TOURS[k] || []).filter(st => visibleEl(st[0])); if (!steps.length) return;
  S._tour = { k, steps, i: 0 }; document.documentElement.classList.add('touring'); showTourStep();
}
function showTourStep() {
  const t = S._tour; if (!t) return; const [sel, title, text] = t.steps[t.i];
  const el = visibleEl(sel); if (!el) return nextTourStep();
  el.scrollIntoView({ block: 'center', behavior: 'instant' });
  setTimeout(() => {
    if (!S._tour) return;
    const r = el.getBoundingClientRect(), pad = 6, vh = window.innerHeight;
    const last = t.i === t.steps.length - 1;
    let box = $('#tour'); if (!box) { box = document.createElement('div'); box.id = 'tour'; document.body.appendChild(box); }
    const below = r.top + r.height / 2 < vh / 2;
    const pos = r.height > vh * 0.55 ? 'bottom:calc(20px + var(--safe-b))' : below ? `top:${Math.min(r.bottom + 14, vh - 200)}px` : `bottom:${Math.max(vh - r.top + 14, 20)}px`;
    box.innerHTML = `<div class="tour-bg" onclick="event.stopPropagation()"></div>
      <div class="tour-spot" style="left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px"></div>
      <div class="tour-card" style="${pos}"><div class="row between"><small class="muted"><b>${t.i + 1} de ${t.steps.length}</b></small><button class="tour-skip" onclick="endTour()">Saltar</button></div>
      <h3 class="mt">${title}</h3><p>${text}</p>
      <div class="row between">${t.i ? '<button class="btn sm" onclick="prevTourStep()">‹ Atrás</button>' : '<span></span>'}<button class="btn sm primary" onclick="nextTourStep()">${last ? '¡Entendido! 👍' : 'Siguiente ›'}</button></div></div>`;
  }, 80);
}
function nextTourStep() { const t = S._tour; if (!t) return; if (t.i >= t.steps.length - 1) return endTour(); t.i++; showTourStep(); }
function prevTourStep() { const t = S._tour; if (!t || !t.i) return; t.i--; showTourStep(); }
function endTour() { const t = S._tour; $('#tour')?.remove(); S._tour = null; document.documentElement.classList.remove('touring'); if (t) { markTour(t.k); if (t.k === 'hoy') { markTour('capi'); markTour('coach'); } if (t.k === 'capi') markTour('coach'); } window.scrollTo({ top: 0, behavior: 'instant' }); $('.sheet')?.scrollTo?.(0, 0); }
async function resetTours() {
  try { localStorage.removeItem('capifit_tours'); } catch (e) { }
  S.profile.toursReset = Date.now(); await Store.saveProfile({ toursReset: S.profile.toursReset });
  toast('Listo: cada pantalla te vuelve a explicar todo'); maybeTour('mas');
}
window.addEventListener('resize', () => { if (S._tour) showTourStep(); });
